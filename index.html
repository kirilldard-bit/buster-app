<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>BUSTER</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="background-overlay"></div>

  <div class="grid-overlay"></div>

  <div class="app-container">

    <!-- TOP PANEL -->

    <div class="top-panel">

      <div class="top-card">

        <div class="card-title">
          STATUS
        </div>

        <div
          class="card-value disconnected"
          id="statusValue"
        >
          DISCONNECTED
        </div>

      </div>

      <div class="top-card">

        <div class="card-title">
          NODE
        </div>

        <div
          class="card-value"
          id="nodeValue"
        >
          MSK-01
        </div>

      </div>

    </div>

    <!-- HOME SCREEN -->

    <div
      class="screen active-screen"
      id="homeScreen"
    >

      <div class="logo">
        BUSTER
      </div>

      <div
        class="timer"
        id="timer"
      >
        00:00:00
      </div>

      <div class="circle-wrapper">

        <div class="circle-glow"></div>

        <button
          class="power-button off"
          id="powerButton"
        >
          <span id="buttonIcon">
            ⏻
          </span>
        </button>

      </div>

      <div
        class="connection-status"
        id="statusText"
      >
        DISCONNECTED
      </div>

      <div class="stats-row">

        <div class="stat-card">

          <div class="stat-label">
            PING
          </div>

          <div
            class="stat-value"
            id="pingValue"
          >
            0ms
          </div>

        </div>

        <div class="stat-card">

          <div class="stat-label">
            ROUTE
          </div>

          <div
            class="stat-value"
            id="routeValue"
          >
            Moscow
          </div>

        </div>

      </div>

      <!-- ORDER BUTTON -->

      <button
        class="order-btn"
        id="orderButton"
      >
        ПОЛУЧИЛ ЗАКАЗ
      </button>

    </div>

    <!-- HISTORY SCREEN -->

    <div
      class="screen"
      id="historyScreen"
    >

      <div class="history-header">
        SYSTEM LOGS
      </div>

      <div
        class="console-window"
        id="consoleWindow"
      >
      </div>

    </div>

    <!-- STATS SCREEN -->

    <div
      class="screen"
      id="statsScreen"
    >

      <div class="settings-header">
        СТАТИСТИКА
      </div>

      <div class="stats-container">

        <!-- ECONOM -->

        <div class="stats-item">

          <div class="stats-tariff">
            Эконом
          </div>

          <div
            class="stats-time"
            id="economTime"
          >
            00:00:00
          </div>

        </div>

        <!-- COMFORT -->

        <div class="stats-item">

          <div class="stats-tariff">
            Комфорт
          </div>

          <div
            class="stats-time"
            id="comfortTime"
          >
            00:00:00
          </div>

        </div>

        <!-- COMFORT PLUS -->

        <div class="stats-item">

          <div class="stats-tariff">
            Комфорт+
          </div>

          <div
            class="stats-time"
            id="comfortPlusTime"
          >
            00:00:00
          </div>

        </div>

        <!-- RESET BUTTON -->

        <button
          class="reset-btn"
          id="resetStatsButton"
        >
          СБРОСИТЬ СТАТИСТИКУ
        </button>

        <!-- HISTORY BUTTON -->

        <button
          id="openOrdersHistory"
          class="stats-history-btn"
        >
          ИСТОРИЯ ЗАКАЗОВ
        </button>

      </div>

    </div>

    <!-- ORDERS SCREEN -->

    <div
      class="screen"
      id="ordersScreen"
    >

      <div class="history-header">
        ИСТОРИЯ ЗАКАЗОВ
      </div>

      <div
        id="analyticsContainer"
        class="analytics-container"
      >
      </div>

    </div>

    <!-- SETTINGS SCREEN -->

    <div
      class="screen"
      id="settingsScreen"
    >

      <div class="settings-header">
        SETTINGS
      </div>

      <div class="settings-form">

        <div class="setting-group">

          <label>
            ГОРОД
          </label>

          <input
            type="text"
            id="cityInput"
            placeholder="Введите город"
          />

        </div>

        <div class="setting-group">

          <label>
            ТАРИФ
          </label>

          <input
            type="text"
            placeholder="Введите тариф"
          />

        </div>

        <div class="setting-group">

          <label>
            РЕЙТИНГ
          </label>

          <input
            type="text"
            placeholder="Введите рейтинг"
          />

        </div>

      </div>

    </div>

    <!-- NAVIGATION -->

    <div class="bottom-nav">

      <button
        class="nav-btn active"
        id="homeTab"
      >
        Главная
      </button>

      <button
        class="nav-btn"
        id="historyTab"
      >
        История
      </button>

      <button
        class="nav-btn"
        id="statsTab"
      >
        Статистика
      </button>

      <button
        class="nav-btn"
        id="settingsTab"
      >
        Настройки
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
